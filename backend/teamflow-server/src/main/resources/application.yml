server:
  port: 8080

spring:
  application:
    name: teamflow

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 端口/密码等全部环境变量化，与 docker-compose.dev.yml 中的变量名保持一致
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:teamflow}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:teamflow123}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:teamflow123}
      connect-timeout: 2s
      timeout: 3s

  jackson:
    # 展示层统一东八区（PRD 6.5）
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    # 驼峰映射：created_at -> createdAt
    map-underscore-to-camel-case: true
    # record/DTO 构造器按参数名映射（需编译保留参数名，父 POM 已开启 -parameters），
    # 避免 SQL 列顺序与构造器参数顺序不一致导致类型错位（DATETIME -> Long）
    arg-name-based-constructor-auto-mapping: true
  global-config:
    banner: false
    db-config:
      # 雪花 ID（接口约定：JSON 中以字符串形式输出，见 common 的 JacksonConfig）
      id-type: assign_id
      # 逻辑删除：实体只要存在 deleted 字段即自动生效
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

teamflow:
  jwt:
    # HS256 密钥（生产环境必须通过 JWT_SECRET 注入；缺省值仅用于本地开发）
    secret: ${JWT_SECRET:teamflow-dev-jwt-secret-key-change-me-in-production-0123456789}
    # Token 有效期（小时），expiresIn = 86400
    expire-hours: 24

logging:
  level:
    com.teamflow: info
